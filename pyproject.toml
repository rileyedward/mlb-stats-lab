[project]
name = "mlb-stats-lab"
version = "0.1.0"
description = "MLB Statcast analytics playground"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Riley Grotenhuis" }]

dependencies = [
    "pybaseball>=2.2.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "jupyterlab>=4.1",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jinja2>=3.1",
    "weasyprint>=61.0",
    "typer>=0.12",
    "nbformat>=5.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "nbclient>=0.10",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    "pre-commit>=3.7",
]

[project.scripts]
statslab = "mlb_stats_lab.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlb_stats_lab"]

# ---- ruff ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "B",
    "SIM",
    "RUF",
]
ignore = [
    "E501",   # line length
    "RUF001", # ambiguous unicode chars in strings (we use em/en dashes intentionally)
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments
    "B905",   # zip() without strict=
    "B023",   # loop var binding (used inside lambdas in rolling helpers)
    "F841",   # unused local var (intentional in a couple of computed-then-skipped paths)
    "N803",   # snake_case argument names
    "N806",   # variable in function should be lowercase
    "SIM117", # nested with statements
    "E741",   # ambiguous variable name (e.g. `l`)
]

[tool.ruff.format]
quote-style = "double"

# ---- mypy ----
[tool.mypy]
python_version = "3.12"
strict = false
files = ["src/mlb_stats_lab"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["pybaseball.*", "weasyprint.*", "seaborn.*", "matplotlib.*"]
ignore_missing_imports = true

# ---- pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: tests that require live pybaseball / network access",
]

# ---- import-linter ----
[tool.importlinter]
root_package = "mlb_stats_lab"

[[tool.importlinter.contracts]]
name = "Layered module dependencies"
type = "layers"
layers = [
    "mlb_stats_lab.cli",
    "mlb_stats_lab.reports",
    "mlb_stats_lab.viz",
    "mlb_stats_lab.batting | mlb_stats_lab.pitching | mlb_stats_lab.fielding",
    "mlb_stats_lab.filters",
    "mlb_stats_lab.data",
    "mlb_stats_lab.config",
]
